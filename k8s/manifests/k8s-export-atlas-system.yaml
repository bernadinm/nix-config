- apiVersion: v1
  data:
    run.py: |
      import os, sys

      pw = os.environ.get("TIMESCALEDB_PASSWORD", "")
      os.environ["ATLAS_TSDB_URL"] = f"postgresql://atlas:{pw}@timescaledb-polaris.atlas-system.svc.cluster.local:5432/atlas"
      import src.data.tick_store as ts; ts._store = None

      from src.screeners.snapshot_provider import get_historical_snapshots
      from src.screeners.dux_bus_scanner import scan_gap_fades_from_snapshots
      from src.analytics.dux_bayesian_gates import assess_dux_setup

      conn = None
      try:
          store = ts.get_tick_store()
          if store._ensure_connection():
              conn = store._conn
      except:
          pass

      if not conn:
          print("ERROR: Cannot connect to TSDB")
          sys.exit(1)

      # Test 5 dates across different periods
      TEST_DATES = [
          "2021-09-15",  # Sep 2021
          "2022-01-18",  # Jan 2022
          "2022-06-15",  # Jun 2022
          "2022-09-16",  # Sep 2022 (AMPX day)
          "2023-03-15",  # Mar 2023
      ]

      print("=" * 80)
      print("MULTI-DATE PARITY TEST: backtest SQL vs forward scanner")
      print("=" * 80)

      total_bt = 0
      total_scanner = 0
      total_both = 0
      total_bt_only = 0

      for date in TEST_DATES:
          print(f"\n--- {date} ---")

          # BACKTEST PATH: SQL gap-up query
          bt_symbols = set()
          try:
              with conn.cursor() as cur:
                  cur.execute(f"""
                      WITH daily_with_prev AS (
                          SELECT DISTINCT ON (symbol, time::date)
                                 symbol, time::date as day, open, high, low, close, volume,
                                 LAG(close) OVER (PARTITION BY symbol ORDER BY time::date) as prev_close
                          FROM market_bars
                          WHERE interval = '1d'
                            AND time::date BETWEEN ('{date}'::date - interval '3 days') AND '{date}'::date
                            AND close > 0
                          ORDER BY symbol, time::date, time DESC
                      )
                      SELECT symbol, ((open - prev_close) / prev_close * 100) as gap_pct
                      FROM daily_with_prev
                      WHERE day = '{date}'::date AND prev_close > 0
                        AND ((open - prev_close) / prev_close * 100) >= 15
                  """)
                  bt_results = cur.fetchall()
                  bt_symbols = {r[0] for r in bt_results}
          except Exception as e:
              print(f"  BT SQL error: {e}")

          # FORWARD TEST PATH: shared scanner
          snapshots = get_historical_snapshots(date, conn=conn)
          setups = scan_gap_fades_from_snapshots(snapshots)

          # Run Bayesian gate on scanner results
          gated_setups = []
          for s in setups:
              gate = assess_dux_setup("gap_up_fade", {
                  "symbol": s.symbol, "price": s.price,
                  "gap_pct": s.gap_pct, "volume": s.volume,
                  "below_vwap": s.below_vwap, "fade_pct": s.fade_pct,
                  "volume_ratio": s.volume_ratio,
              })
              if gate and gate.should_trade:
                  gated_setups.append((s, gate))

          scanner_symbols = {s.symbol for s in setups}
          gated_symbols = {s.symbol for s, g in gated_setups}

          in_both = bt_symbols & scanner_symbols
          bt_only = bt_symbols - scanner_symbols

          print(f"  Snapshots: {len(snapshots)} | BT gaps: {len(bt_symbols)} | Scanner: {len(setups)} | Gated: {len(gated_setups)}")
          print(f"  In both: {len(in_both)} | BT-only: {len(bt_only)}")

          if bt_only:
              for sym in list(bt_only)[:3]:
                  gap = [r[1] for r in bt_results if r[0] == sym]
                  print(f"    MISS: {sym} gap={gap[0]:.1f}%")

          # Show top gated trades (what forward test would actually trade)
          for s, g in gated_setups[:3]:
              print(f"    TRADE: {s.symbol} gap={s.gap_pct:.1f}% grade={g.grade} posterior={g.posterior:.2f}")

          total_bt += len(bt_symbols)
          total_scanner += len(setups)
          total_both += len(in_both)
          total_bt_only += len(bt_only)

      print(f"\n{'=' * 80}")
      print(f"SUMMARY across {len(TEST_DATES)} dates:")
      print(f"  Backtest found: {total_bt} gap-ups")
      print(f"  Scanner found:  {total_scanner} setups")
      print(f"  In both:        {total_both}")
      print(f"  BT-only misses: {total_bt_only}")
      if total_bt > 0:
          parity = total_both / total_bt * 100
          print(f"  Parity:         {parity:.1f}%")
          if parity >= 90:
              print(f"  *** PARITY PASS ({parity:.0f}%) ***")
          else:
              print(f"  *** PARITY NEEDS WORK ({parity:.0f}%) ***")
