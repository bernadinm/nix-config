- apiVersion: v1
  data:
    import.py: |
      import csv, gzip, io, logging, os, sys, time, gc
      from datetime import datetime, timedelta, timezone

      logging.basicConfig(level=logging.INFO, format="%(asctime)s %(message)s")
      log = logging.getLogger("import")

      def get_s3():
          import boto3
          from botocore.config import Config
          return boto3.client("s3", endpoint_url="https://files.massive.com",
              aws_access_key_id="04675bce-524b-4423-997a-f246ff5ca354",
              aws_secret_access_key=os.environ.get("POLYGON_API_KEY",""),
              config=Config(signature_version="s3v4"), region_name="us-east-1")

      def get_conn():
          import psycopg2
          pw = os.environ.get("TIMESCALEDB_PASSWORD", "")
          conn = psycopg2.connect(f"postgresql://atlas:{pw}@timescaledb-polaris.atlas-system.svc.cluster.local:5432/atlas")
          conn.autocommit = False
          return conn

      s3 = get_s3()
      conn = get_conn()

      start = datetime(2025, 5, 1)
      end = datetime(2026, 7, 25)
      days = [c.strftime("%Y-%m-%d") for c in (start + timedelta(days=i) for i in range((end - start).days + 1)) if c.weekday() < 5]

      log.info("RESUME: %d days from %s to %s", len(days), days[0], days[-1])
      total = 0

      for i, d in enumerate(days):
          key = f"us_stocks_sip/minute_aggs_v1/{d[:4]}/{d[5:7]}/{d}.csv.gz"
          try:
              resp = s3.get_object(Bucket="flatfiles", Key=key)
              compressed = resp["Body"].read()
              raw = gzip.decompress(compressed)
              del compressed
              reader = csv.reader(io.StringIO(raw.decode("utf-8")))
              del raw
              import psycopg2.extras
              batch = []
              day_total = 0
              for row in reader:
                  if len(row) < 7 or row[0] == "ticker":
                      continue
                  try:
                      ts = datetime.fromtimestamp(int(row[6]) / 1e9, tz=timezone.utc)
                      batch.append((ts, row[0], "1m", float(row[2]), float(row[4]),
                                 float(row[5]), float(row[3]), int(float(row[1])), None))
                  except (ValueError, IndexError):
                      continue
                  if len(batch) >= 500000:
                      with conn.cursor() as cur:
                          psycopg2.extras.execute_values(cur,
                              "INSERT INTO market_bars (time,symbol,interval,open,high,low,close,volume,vwap) VALUES %s ON CONFLICT DO NOTHING",
                              batch, page_size=5000)
                      conn.commit()
                      day_total += len(batch)
                      batch = []
              if batch:
                  with conn.cursor() as cur:
                      psycopg2.extras.execute_values(cur,
                          "INSERT INTO market_bars (time,symbol,interval,open,high,low,close,volume,vwap) VALUES %s ON CONFLICT DO NOTHING",
                          batch, page_size=5000)
                  conn.commit()
                  day_total += len(batch)
              total += day_total
              del batch
              gc.collect()
              if (i+1) % 10 == 0:
                  log.info("[%d/%d] %s | day: %s | Total: %s bars", i+1, len(days), d, f"{day_total:,}", f"{total:,}")
          except Exception as e:
              if "NoSuchKey" in str(e) or "403" in str(e):
                  continue
              log.error("[%d/%d] %s: %s", i+1, len(days), d, e)
              try:
                  conn.rollback()
              except:
                  conn = get_conn()

      log.info("DONE: %s bars imported", f"{total:,}")
  kind: ConfigMap
  metadata:
    creationTimestamp: "2026-07-25T19:29:41Z"
    name: flatfile-import-script
    namespace: atlas-system
    resourceVersion: "33405025"
    uid: b50307cb-7337-4d7c-8e41-eeafe8a863a8
- apiVersion: v1
  data:
    watch.sh: |
      #!/bin/bash
      set -euo pipefail

      GOTIFY_URL="${GOTIFY_URL:-http://gotify.atlas-system.svc.cluster.local:80}"
      GOTIFY_TOKEN="${GOTIFY_TOKEN}"
      CF_ACCOUNT_ID="${CF_ACCOUNT_ID}"
      CF_EMAIL="${CF_EMAIL}"
      CF_API_KEY="${CF_API_KEY}"
      AUCTION_URL="https://www.hetzner.com/_resources/app/data/app/live_data_sb_EUR.json"

      SEEN_FILE="/tmp/seen.json"
      HISTORY_FILE="/tmp/history.json"
      kubectl get configmap hetzner-watcher-state -n atlas-system -o jsonpath='{.data.seen\.json}' > "$SEEN_FILE" 2>/dev/null || echo '{}' > "$SEEN_FILE"
      kubectl get configmap hetzner-watcher-state -n atlas-system -o jsonpath='{.data.history\.json}' > "$HISTORY_FILE" 2>/dev/null || echo '{}' > "$HISTORY_FILE"

      data=$(curl -sf --max-time 30 "$AUCTION_URL") || { echo "Failed to fetch"; exit 1; }

      # Stage 1: Tighter spec filter - only servers worth evaluating
      matches=$(echo "$data" | jq '[.server[] | select(
        .ram_size >= 128 and
        .price <= 220 and
        .is_ecc and
        ((.serverDiskData.nvme | length) > 0)
      ) | {
        id: (.key | tostring),
        cpu: .cpu,
        cores: .cpu_count,
        ram: .ram_size,
        price: .price,
        dc: .datacenter,
        disks: (.hdd_arr | join(", ")),
        has_nvme: ((.serverDiskData.nvme | length) > 0),
        nvme_count: (.serverDiskData.nvme | length),
        sata_count: (.serverDiskData.sata | length),
        hdd_count: (.serverDiskData.hdd | length),
        total_storage_gb: (([.serverDiskData.nvme[], .serverDiskData.sata[], .serverDiskData.hdd[]] | add) // 0),
        next_reduce: (.next_reduce_timestamp | todate),
        next_reduce_seconds: .next_reduce,
        benchmark: (.cpu_benchmark // 0),
        setup_fee: (.setup_price // 0),
        specials: (.specials // [])
      }]')

      count=$(echo "$matches" | jq 'length')
      echo "Stage 1: $count servers pass filter (128GB+ ECC, NVMe, under 220EUR)"

      if [ "$count" -eq 0 ]; then
        echo "No matches, exiting."
        exit 0
      fi

      # Check for new or price-changed servers
      seen=$(cat "$SEEN_FILE")
      history=$(cat "$HISTORY_FILE")
      changed_servers="[]"

      echo "$matches" | jq -c '.[]' > /tmp/servers.jsonl

      while IFS= read -r server; do
        sid=$(echo "$server" | jq -r '.id')
        price=$(echo "$server" | jq -r '.price')
        seen_price=$(echo "$seen" | jq -r --arg id "$sid" '.[$id] // "0"')

        if [ "$seen_price" = "$price" ]; then
          continue
        fi

        # Track price history
        ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        history=$(echo "$history" | jq --arg id "$sid" --arg p "$price" --arg t "$ts" '
          .[$id] = ((.[$id] // []) + [{"price": ($p | tonumber), "time": $t}])
          | .[$id] = (.[$id] | if length > 20 then .[-20:] else . end)
        ')

        # Add price trend to server data
        price_history=$(echo "$history" | jq -c --arg id "$sid" '.[$id] // []')
        server_with_history=$(echo "$server" | jq --argjson hist "$price_history" --arg sp "$seen_price" '. + {
          price_history: $hist,
          previous_price: (if $sp == "0" then null else ($sp | tonumber) end),
          is_new: ($sp == "0")
        }')

        changed_servers=$(echo "$changed_servers" | jq --argjson s "$server_with_history" '. + [$s]')
      done < /tmp/servers.jsonl

      changed_count=$(echo "$changed_servers" | jq 'length')
      echo "Stage 1.5: $changed_count new or price-changed servers"

      if [ "$changed_count" -eq 0 ]; then
        echo "No changes, saving state and exiting."
        # Still persist in case history was updated
        echo "$seen" > "$SEEN_FILE"
        echo "$history" > "$HISTORY_FILE"
        kubectl create configmap hetzner-watcher-state -n atlas-system \
          --from-file=seen.json="$SEEN_FILE" \
          --from-file=history.json="$HISTORY_FILE" \
          --dry-run=client -o yaml | kubectl apply -f -
        exit 0
      fi

      # Stage 2: LLM evaluation via Cloudflare Workers AI
      echo "Stage 2: Evaluating $changed_count servers with LLM..."

      server_list=$(echo "$changed_servers" | jq -r '[.[] | "- #\(.id) \(.cpu) | \(.cores) cores | \(.ram)GB ECC | \(.disks) | \(.dc) | \(.price)EUR/mo | NVMe:\(.has_nvme) | benchmark:\(.benchmark) | \(if .is_new then "NEW" else "was \(.previous_price)EUR" end)"] | join("\n")')

      prompt="You are a ruthlessly analytical infrastructure advisor. Evaluate Hetzner Server Auction deals for a company replacing a broken server.

      SITUATION: Replacing polaris (Ryzen 5 3600, 64GB, Helsinki) which has a PROCHOT hardware defect. Need a database server for TimescaleDB (45GB, 7-year backtest data) running as a k3s agent node.

      BASELINE PRICES FOR NEW SERVERS (the benchmark to beat):
      - AX42: Ryzen 7 PRO 8700GE, 8c, 64GB ECC, 2x1.92TB NVMe = 59EUR/mo
      - AX102: Ryzen 9 7950X3D, 16c, 128GB ECC, 2x1.92TB NVMe = 130EUR/mo
      - AX162: EPYC 9454P, 48c, 128GB ECC, 2x1.92TB NVMe = 199EUR/mo

      HARD REQUIREMENTS (fail any = automatic SKIP):
      - Must have NVMe (SATA SSDs are too slow for TimescaleDB)
      - Must have ECC RAM
      - Must be CHEAPER than buying the equivalent new server
      - Consumer CPUs (i7, Ryzen without ECC boards) = SKIP

      STRONG PREFERENCES:
      - 128GB+ RAM (64GB works but 128GB is much better for DB caching)
      - Server-grade CPU: EPYC >> Xeon >> Ryzen (reliability matters for remote server)
      - Helsinki (HEL1) datacenter preferred (same DC as current server)
      - More cores = better for parallel DB queries

      SERVERS:
      ${server_list}

      Respond ONLY with a JSON array. No markdown, no explanation outside JSON.
      [
        {
          \"id\": \"server_id\",
          \"score\": 1-10,
          \"verdict\": \"SKIP\" or \"WATCH\" or \"CONSIDER\" or \"BUY_NOW\",
          \"reason\": \"specific comparison - e.g. 'EPYC 7502P with 128GB at 157EUR is 21% cheaper than new AX162 (199EUR) with similar specs, and in HEL1'\"
        }
      ]

      SCORING RULES (be strict):
      - 1-4 (SKIP): No NVMe, consumer CPU, costs more than new equivalent, <64GB RAM, old architecture (Haswell/Broadwell)
      - 5-6 (WATCH): Has NVMe+ECC but price is only marginally better than new, or wrong datacenter, or Ryzen (less reliable than EPYC/Xeon for servers)
      - 7-8 (CONSIDER): 15-25% cheaper than new equivalent, has NVMe+ECC+128GB, server-grade CPU
      - 9 (BUY_NOW): 25%+ cheaper than new equivalent, EPYC or Xeon, NVMe, 128GB+ ECC, ideally HEL1
      - 10 (BUY_NOW): Same as 9 but in HEL1 datacenter AND significantly cheaper

      CRITICAL: A Ryzen 7 3700X at 137EUR is NOT a 9/10. The new AX102 (Ryzen 9 7950X3D) costs 130EUR with better specs. That Ryzen is a SKIP. Always compare against what you can buy NEW.
      Most servers should score 1-5. Score 9+ should be RARE - maybe 1-2 out of 50 servers."

      llm_response=$(curl -sf --max-time 120 \
        "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct" \
        -H "X-Auth-Email: ${CF_EMAIL}" \
        -H "X-Auth-Key: ${CF_API_KEY}" \
        -H "Content-Type: application/json" \
        -d "$(jq -n --arg p "$prompt" '{
          messages: [
            {role: "system", content: "You are a server infrastructure advisor. Respond ONLY with valid JSON array. No markdown, no explanation outside the JSON."},
            {role: "user", content: $p}
          ],
          max_tokens: 4000
        }')" 2>/dev/null)

      if [ -z "$llm_response" ]; then
        echo "LLM call failed, skipping notifications this cycle"
        : > /tmp/notify.jsonl
      else
        echo "LLM response received"
        # Parse LLM scores
        # Extract JSON array from LLM response - handle markdown code blocks
        raw_response=$(echo "$llm_response" | jq -r '.result.response // empty' 2>/dev/null)
        scores=$(echo "$raw_response" | sed 's/```json//g; s/```//g' | jq -c '.' 2>/dev/null || echo "[]")

        if [ "$scores" = "[]" ] || [ -z "$scores" ]; then
          echo "Failed to parse LLM scores, skipping notifications this cycle"
          : > /tmp/notify.jsonl
        else
          echo "Scores parsed: $scores"
          # Only notify CONSIDER (7-8) and BUY_NOW (9-10)
          echo "$changed_servers" | jq -c '.[]' > /tmp/notify.jsonl.tmp
          : > /tmp/notify.jsonl
          while IFS= read -r server; do
            sid=$(echo "$server" | jq -r '.id')
            # Match by id - LLM may return id as "#3040803" or "3040803" or 3040803
            score_entry=$(echo "$scores" | jq -c --arg id "$sid" '.[] | select((.id | tostring | ltrimstr("#")) == $id)' 2>/dev/null || echo "")
            if [ -n "$score_entry" ]; then
              score=$(echo "$score_entry" | jq -r '.score // 0')
              verdict=$(echo "$score_entry" | jq -r '.verdict // "SKIP"')
              reason=$(echo "$score_entry" | jq -r '.reason // "No reason given"')
              echo "  Server #${sid}: score=${score} verdict=${verdict} - ${reason}"
              if [ "$score" -ge 9 ] 2>/dev/null; then
                server_scored=$(echo "$server" | jq -c --argjson s "$score" --arg v "$verdict" --arg r "$reason" '. + {llm_score: $s, llm_verdict: $v, llm_reason: $r}' 2>/dev/null)
                if [ -n "$server_scored" ] && echo "$server_scored" | jq . >/dev/null 2>&1; then
                  echo "$server_scored" >> /tmp/notify.jsonl
                fi
              fi
            else
              echo "  Server #${sid}: no score from LLM, skipping"
            fi
          done < /tmp/notify.jsonl.tmp
        fi
      fi

      # Stage 3: Notify only LLM-approved servers
      notify_count=$(wc -l < /tmp/notify.jsonl | tr -d ' ')
      echo "Stage 3: Notifying for $notify_count servers"

      while IFS= read -r server; do
        [ -z "$server" ] && continue
        sid=$(echo "$server" | jq -r '.id')
        price=$(echo "$server" | jq -r '.price')
        cpu=$(echo "$server" | jq -r '.cpu')
        ram=$(echo "$server" | jq -r '.ram')
        disks=$(echo "$server" | jq -r '.disks')
        dc=$(echo "$server" | jq -r '.dc')
        has_nvme=$(echo "$server" | jq -r '.has_nvme')
        next_reduce=$(echo "$server" | jq -r '.next_reduce')
        prev_price=$(echo "$server" | jq -r '.previous_price // "new"')
        is_new=$(echo "$server" | jq -r '.is_new')
        llm_score=$(echo "$server" | jq -r '.llm_score // "?"')
        llm_verdict=$(echo "$server" | jq -r '.llm_verdict // "UNKNOWN"')
        llm_reason=$(echo "$server" | jq -r '.llm_reason // ""')
        benchmark=$(echo "$server" | jq -r '.benchmark')

        if [ "$llm_verdict" = "BUY_NOW" ]; then
          title="BUY NOW: ${cpu} - ${price}EUR/mo [${llm_score}/10]"
          priority=10
        elif [ "$is_new" = "true" ]; then
          title="Good Deal: ${cpu} - ${price}EUR/mo [${llm_score}/10]"
          priority=8
        else
          title="Price Drop: ${cpu} - ${price}EUR (was ${prev_price}EUR) [${llm_score}/10]"
          priority=8
        fi

        nvme_label=""
        [ "$has_nvme" = "true" ] && nvme_label="NVMe" || nvme_label="SATA/HDD"

        msg="[${llm_verdict}] ${llm_reason}

      Server #${sid} in ${dc}
      CPU: ${cpu} (benchmark: ${benchmark})
      RAM: ${ram}GB ECC
      Storage: ${disks} (${nvme_label})
      Price: ${price} EUR/mo
      Next price drop: ${next_reduce}

      Order: https://www.hetzner.com/sb#auctions/${sid}"

        echo "Notifying: $title"
        curl -sf -X POST "${GOTIFY_URL}/message" \
          -H "Content-Type: application/json" \
          -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
          -d "$(jq -n --arg t "$title" --arg m "$msg" --argjson p "$priority" \
            '{title: $t, message: $m, priority: $p}')" > /dev/null 2>&1 || true

        # Update seen state
        updated=$(cat "$SEEN_FILE")
        updated=$(echo "$updated" | jq --arg id "$sid" --arg p "$price" '.[$id] = $p')
        echo "$updated" > "$SEEN_FILE"
      done < /tmp/notify.jsonl

      # Update seen for ALL servers (even ones we didn't notify about) so we don't re-evaluate
      echo "$matches" | jq -c '.[]' > /tmp/all.jsonl
      updated_seen=$(cat "$SEEN_FILE")
      while IFS= read -r server; do
        sid=$(echo "$server" | jq -r '.id')
        price=$(echo "$server" | jq -r '.price')
        updated_seen=$(echo "$updated_seen" | jq --arg id "$sid" --arg p "$price" '.[$id] = $p')
      done < /tmp/all.jsonl
      echo "$updated_seen" > "$SEEN_FILE"

      # Persist state
      kubectl create configmap hetzner-watcher-state -n atlas-system \
        --from-file=seen.json="$SEEN_FILE" \
        --from-file=history.json="$HISTORY_FILE" \
        --dry-run=client -o yaml | kubectl apply -f -

      echo "Done. State saved."
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"watch.sh":"#!/bin/bash\nset -euo pipefail\n\nGOTIFY_URL=\"${GOTIFY_URL:-http://gotify.atlas-system.svc.cluster.local:80}\"\nGOTIFY_TOKEN=\"${GOTIFY_TOKEN}\"\nCF_ACCOUNT_ID=\"${CF_ACCOUNT_ID}\"\nCF_EMAIL=\"${CF_EMAIL}\"\nCF_API_KEY=\"${CF_API_KEY}\"\nAUCTION_URL=\"https://www.hetzner.com/_resources/app/data/app/live_data_sb_EUR.json\"\n\nSEEN_FILE=\"/tmp/seen.json\"\nHISTORY_FILE=\"/tmp/history.json\"\nkubectl get configmap hetzner-watcher-state -n atlas-system -o jsonpath='{.data.seen\\.json}' \u003e \"$SEEN_FILE\" 2\u003e/dev/null || echo '{}' \u003e \"$SEEN_FILE\"\nkubectl get configmap hetzner-watcher-state -n atlas-system -o jsonpath='{.data.history\\.json}' \u003e \"$HISTORY_FILE\" 2\u003e/dev/null || echo '{}' \u003e \"$HISTORY_FILE\"\n\ndata=$(curl -sf --max-time 30 \"$AUCTION_URL\") || { echo \"Failed to fetch\"; exit 1; }\n\n# Stage 1: Tighter spec filter - only servers worth evaluating\nmatches=$(echo \"$data\" | jq '[.server[] | select(\n  .ram_size \u003e= 128 and\n  .price \u003c= 220 and\n  .is_ecc and\n  ((.serverDiskData.nvme | length) \u003e 0)\n) | {\n  id: (.key | tostring),\n  cpu: .cpu,\n  cores: .cpu_count,\n  ram: .ram_size,\n  price: .price,\n  dc: .datacenter,\n  disks: (.hdd_arr | join(\", \")),\n  has_nvme: ((.serverDiskData.nvme | length) \u003e 0),\n  nvme_count: (.serverDiskData.nvme | length),\n  sata_count: (.serverDiskData.sata | length),\n  hdd_count: (.serverDiskData.hdd | length),\n  total_storage_gb: (([.serverDiskData.nvme[], .serverDiskData.sata[], .serverDiskData.hdd[]] | add) // 0),\n  next_reduce: (.next_reduce_timestamp | todate),\n  next_reduce_seconds: .next_reduce,\n  benchmark: (.cpu_benchmark // 0),\n  setup_fee: (.setup_price // 0),\n  specials: (.specials // [])\n}]')\n\ncount=$(echo \"$matches\" | jq 'length')\necho \"Stage 1: $count servers pass filter (128GB+ ECC, NVMe, under 220EUR)\"\n\nif [ \"$count\" -eq 0 ]; then\n  echo \"No matches, exiting.\"\n  exit 0\nfi\n\n# Check for new or price-changed servers\nseen=$(cat \"$SEEN_FILE\")\nhistory=$(cat \"$HISTORY_FILE\")\nchanged_servers=\"[]\"\n\necho \"$matches\" | jq -c '.[]' \u003e /tmp/servers.jsonl\n\nwhile IFS= read -r server; do\n  sid=$(echo \"$server\" | jq -r '.id')\n  price=$(echo \"$server\" | jq -r '.price')\n  seen_price=$(echo \"$seen\" | jq -r --arg id \"$sid\" '.[$id] // \"0\"')\n\n  if [ \"$seen_price\" = \"$price\" ]; then\n    continue\n  fi\n\n  # Track price history\n  ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n  history=$(echo \"$history\" | jq --arg id \"$sid\" --arg p \"$price\" --arg t \"$ts\" '\n    .[$id] = ((.[$id] // []) + [{\"price\": ($p | tonumber), \"time\": $t}])\n    | .[$id] = (.[$id] | if length \u003e 20 then .[-20:] else . end)\n  ')\n\n  # Add price trend to server data\n  price_history=$(echo \"$history\" | jq -c --arg id \"$sid\" '.[$id] // []')\n  server_with_history=$(echo \"$server\" | jq --argjson hist \"$price_history\" --arg sp \"$seen_price\" '. + {\n    price_history: $hist,\n    previous_price: (if $sp == \"0\" then null else ($sp | tonumber) end),\n    is_new: ($sp == \"0\")\n  }')\n\n  changed_servers=$(echo \"$changed_servers\" | jq --argjson s \"$server_with_history\" '. + [$s]')\ndone \u003c /tmp/servers.jsonl\n\nchanged_count=$(echo \"$changed_servers\" | jq 'length')\necho \"Stage 1.5: $changed_count new or price-changed servers\"\n\nif [ \"$changed_count\" -eq 0 ]; then\n  echo \"No changes, saving state and exiting.\"\n  # Still persist in case history was updated\n  echo \"$seen\" \u003e \"$SEEN_FILE\"\n  echo \"$history\" \u003e \"$HISTORY_FILE\"\n  kubectl create configmap hetzner-watcher-state -n atlas-system \\\n    --from-file=seen.json=\"$SEEN_FILE\" \\\n    --from-file=history.json=\"$HISTORY_FILE\" \\\n    --dry-run=client -o yaml | kubectl apply -f -\n  exit 0\nfi\n\n# Stage 2: LLM evaluation via Cloudflare Workers AI\necho \"Stage 2: Evaluating $changed_count servers with LLM...\"\n\nserver_list=$(echo \"$changed_servers\" | jq -r '[.[] | \"- #\\(.id) \\(.cpu) | \\(.cores) cores | \\(.ram)GB ECC | \\(.disks) | \\(.dc) | \\(.price)EUR/mo | NVMe:\\(.has_nvme) | benchmark:\\(.benchmark) | \\(if .is_new then \"NEW\" else \"was \\(.previous_price)EUR\" end)\"] | join(\"\\n\")')\n\nprompt=\"You are a ruthlessly analytical infrastructure advisor. Evaluate Hetzner Server Auction deals for a company replacing a broken server.\n\nSITUATION: Replacing polaris (Ryzen 5 3600, 64GB, Helsinki) which has a PROCHOT hardware defect. Need a database server for TimescaleDB (45GB, 7-year backtest data) running as a k3s agent node.\n\nBASELINE PRICES FOR NEW SERVERS (the benchmark to beat):\n- AX42: Ryzen 7 PRO 8700GE, 8c, 64GB ECC, 2x1.92TB NVMe = 59EUR/mo\n- AX102: Ryzen 9 7950X3D, 16c, 128GB ECC, 2x1.92TB NVMe = 130EUR/mo\n- AX162: EPYC 9454P, 48c, 128GB ECC, 2x1.92TB NVMe = 199EUR/mo\n\nHARD REQUIREMENTS (fail any = automatic SKIP):\n- Must have NVMe (SATA SSDs are too slow for TimescaleDB)\n- Must have ECC RAM\n- Must be CHEAPER than buying the equivalent new server\n- Consumer CPUs (i7, Ryzen without ECC boards) = SKIP\n\nSTRONG PREFERENCES:\n- 128GB+ RAM (64GB works but 128GB is much better for DB caching)\n- Server-grade CPU: EPYC \u003e\u003e Xeon \u003e\u003e Ryzen (reliability matters for remote server)\n- Helsinki (HEL1) datacenter preferred (same DC as current server)\n- More cores = better for parallel DB queries\n\nSERVERS:\n${server_list}\n\nRespond ONLY with a JSON array. No markdown, no explanation outside JSON.\n[\n  {\n    \\\"id\\\": \\\"server_id\\\",\n    \\\"score\\\": 1-10,\n    \\\"verdict\\\": \\\"SKIP\\\" or \\\"WATCH\\\" or \\\"CONSIDER\\\" or \\\"BUY_NOW\\\",\n    \\\"reason\\\": \\\"specific comparison - e.g. 'EPYC 7502P with 128GB at 157EUR is 21% cheaper than new AX162 (199EUR) with similar specs, and in HEL1'\\\"\n  }\n]\n\nSCORING RULES (be strict):\n- 1-4 (SKIP): No NVMe, consumer CPU, costs more than new equivalent, \u003c64GB RAM, old architecture (Haswell/Broadwell)\n- 5-6 (WATCH): Has NVMe+ECC but price is only marginally better than new, or wrong datacenter, or Ryzen (less reliable than EPYC/Xeon for servers)\n- 7-8 (CONSIDER): 15-25% cheaper than new equivalent, has NVMe+ECC+128GB, server-grade CPU\n- 9 (BUY_NOW): 25%+ cheaper than new equivalent, EPYC or Xeon, NVMe, 128GB+ ECC, ideally HEL1\n- 10 (BUY_NOW): Same as 9 but in HEL1 datacenter AND significantly cheaper\n\nCRITICAL: A Ryzen 7 3700X at 137EUR is NOT a 9/10. The new AX102 (Ryzen 9 7950X3D) costs 130EUR with better specs. That Ryzen is a SKIP. Always compare against what you can buy NEW.\nMost servers should score 1-5. Score 9+ should be RARE - maybe 1-2 out of 50 servers.\"\n\nllm_response=$(curl -sf --max-time 120 \\\n  \"https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct\" \\\n  -H \"X-Auth-Email: ${CF_EMAIL}\" \\\n  -H \"X-Auth-Key: ${CF_API_KEY}\" \\\n  -H \"Content-Type: application/json\" \\\n  -d \"$(jq -n --arg p \"$prompt\" '{\n    messages: [\n      {role: \"system\", content: \"You are a server infrastructure advisor. Respond ONLY with valid JSON array. No markdown, no explanation outside the JSON.\"},\n      {role: \"user\", content: $p}\n    ],\n    max_tokens: 4000\n  }')\" 2\u003e/dev/null)\n\nif [ -z \"$llm_response\" ]; then\n  echo \"LLM call failed, skipping notifications this cycle\"\n  : \u003e /tmp/notify.jsonl\nelse\n  echo \"LLM response received\"\n  # Parse LLM scores\n  # Extract JSON array from LLM response - handle markdown code blocks\n  raw_response=$(echo \"$llm_response\" | jq -r '.result.response // empty' 2\u003e/dev/null)\n  scores=$(echo \"$raw_response\" | sed 's/```json//g; s/```//g' | jq -c '.' 2\u003e/dev/null || echo \"[]\")\n\n  if [ \"$scores\" = \"[]\" ] || [ -z \"$scores\" ]; then\n    echo \"Failed to parse LLM scores, skipping notifications this cycle\"\n    : \u003e /tmp/notify.jsonl\n  else\n    echo \"Scores parsed: $scores\"\n    # Only notify CONSIDER (7-8) and BUY_NOW (9-10)\n    echo \"$changed_servers\" | jq -c '.[]' \u003e /tmp/notify.jsonl.tmp\n    : \u003e /tmp/notify.jsonl\n    while IFS= read -r server; do\n      sid=$(echo \"$server\" | jq -r '.id')\n      # Match by id - LLM may return id as \"#3040803\" or \"3040803\" or 3040803\n      score_entry=$(echo \"$scores\" | jq -c --arg id \"$sid\" '.[] | select((.id | tostring | ltrimstr(\"#\")) == $id)' 2\u003e/dev/null || echo \"\")\n      if [ -n \"$score_entry\" ]; then\n        score=$(echo \"$score_entry\" | jq -r '.score // 0')\n        verdict=$(echo \"$score_entry\" | jq -r '.verdict // \"SKIP\"')\n        reason=$(echo \"$score_entry\" | jq -r '.reason // \"No reason given\"')\n        echo \"  Server #${sid}: score=${score} verdict=${verdict} - ${reason}\"\n        if [ \"$score\" -ge 9 ] 2\u003e/dev/null; then\n          server_scored=$(echo \"$server\" | jq -c --argjson s \"$score\" --arg v \"$verdict\" --arg r \"$reason\" '. + {llm_score: $s, llm_verdict: $v, llm_reason: $r}' 2\u003e/dev/null)\n          if [ -n \"$server_scored\" ] \u0026\u0026 echo \"$server_scored\" | jq . \u003e/dev/null 2\u003e\u00261; then\n            echo \"$server_scored\" \u003e\u003e /tmp/notify.jsonl\n          fi\n        fi\n      else\n        echo \"  Server #${sid}: no score from LLM, skipping\"\n      fi\n    done \u003c /tmp/notify.jsonl.tmp\n  fi\nfi\n\n# Stage 3: Notify only LLM-approved servers\nnotify_count=$(wc -l \u003c /tmp/notify.jsonl | tr -d ' ')\necho \"Stage 3: Notifying for $notify_count servers\"\n\nwhile IFS= read -r server; do\n  [ -z \"$server\" ] \u0026\u0026 continue\n  sid=$(echo \"$server\" | jq -r '.id')\n  price=$(echo \"$server\" | jq -r '.price')\n  cpu=$(echo \"$server\" | jq -r '.cpu')\n  ram=$(echo \"$server\" | jq -r '.ram')\n  disks=$(echo \"$server\" | jq -r '.disks')\n  dc=$(echo \"$server\" | jq -r '.dc')\n  has_nvme=$(echo \"$server\" | jq -r '.has_nvme')\n  next_reduce=$(echo \"$server\" | jq -r '.next_reduce')\n  prev_price=$(echo \"$server\" | jq -r '.previous_price // \"new\"')\n  is_new=$(echo \"$server\" | jq -r '.is_new')\n  llm_score=$(echo \"$server\" | jq -r '.llm_score // \"?\"')\n  llm_verdict=$(echo \"$server\" | jq -r '.llm_verdict // \"UNKNOWN\"')\n  llm_reason=$(echo \"$server\" | jq -r '.llm_reason // \"\"')\n  benchmark=$(echo \"$server\" | jq -r '.benchmark')\n\n  if [ \"$llm_verdict\" = \"BUY_NOW\" ]; then\n    title=\"BUY NOW: ${cpu} - ${price}EUR/mo [${llm_score}/10]\"\n    priority=10\n  elif [ \"$is_new\" = \"true\" ]; then\n    title=\"Good Deal: ${cpu} - ${price}EUR/mo [${llm_score}/10]\"\n    priority=8\n  else\n    title=\"Price Drop: ${cpu} - ${price}EUR (was ${prev_price}EUR) [${llm_score}/10]\"\n    priority=8\n  fi\n\n  nvme_label=\"\"\n  [ \"$has_nvme\" = \"true\" ] \u0026\u0026 nvme_label=\"NVMe\" || nvme_label=\"SATA/HDD\"\n\n  msg=\"[${llm_verdict}] ${llm_reason}\n\nServer #${sid} in ${dc}\nCPU: ${cpu} (benchmark: ${benchmark})\nRAM: ${ram}GB ECC\nStorage: ${disks} (${nvme_label})\nPrice: ${price} EUR/mo\nNext price drop: ${next_reduce}\n\nOrder: https://www.hetzner.com/sb#auctions/${sid}\"\n\n  echo \"Notifying: $title\"\n  curl -sf -X POST \"${GOTIFY_URL}/message\" \\\n    -H \"Content-Type: application/json\" \\\n    -H \"X-Gotify-Key: ${GOTIFY_TOKEN}\" \\\n    -d \"$(jq -n --arg t \"$title\" --arg m \"$msg\" --argjson p \"$priority\" \\\n      '{title: $t, message: $m, priority: $p}')\" \u003e /dev/null 2\u003e\u00261 || true\n\n  # Update seen state\n  updated=$(cat \"$SEEN_FILE\")\n  updated=$(echo \"$updated\" | jq --arg id \"$sid\" --arg p \"$price\" '.[$id] = $p')\n  echo \"$updated\" \u003e \"$SEEN_FILE\"\ndone \u003c /tmp/notify.jsonl\n\n# Update seen for ALL servers (even ones we didn't notify about) so we don't re-evaluate\necho \"$matches\" | jq -c '.[]' \u003e /tmp/all.jsonl\nupdated_seen=$(cat \"$SEEN_FILE\")\nwhile IFS= read -r server; do\n  sid=$(echo \"$server\" | jq -r '.id')\n  price=$(echo \"$server\" | jq -r '.price')\n  updated_seen=$(echo \"$updated_seen\" | jq --arg id \"$sid\" --arg p \"$price\" '.[$id] = $p')\ndone \u003c /tmp/all.jsonl\necho \"$updated_seen\" \u003e \"$SEEN_FILE\"\n\n# Persist state\nkubectl create configmap hetzner-watcher-state -n atlas-system \\\n  --from-file=seen.json=\"$SEEN_FILE\" \\\n  --from-file=history.json=\"$HISTORY_FILE\" \\\n  --dry-run=client -o yaml | kubectl apply -f -\n\necho \"Done. State saved.\"\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"hetzner-watcher-script","namespace":"atlas-system"}}
