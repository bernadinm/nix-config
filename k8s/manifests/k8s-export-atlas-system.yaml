  data:
    run.py: |
      import os, sys, json, time

      pw = os.environ.get("TIMESCALEDB_PASSWORD", "")
      os.environ["ATLAS_TSDB_URL"] = f"postgresql://atlas:{pw}@timescaledb-polaris.atlas-system.svc.cluster.local:5432/atlas"
      import src.data.tick_store as ts; ts._store = None

      from src.backtesting.dux_hifi_backtest import run_hifi_dux_backtest

      print("=" * 70)
      print("  5-YEAR DUX BACKTEST | Shared Scanner | $27K")
      print("  Jul 2021 - Jul 2026 | Continuous Aggregate | All Patterns")
      print("=" * 70)

      t0 = time.time()
      r = run_hifi_dux_backtest(start_date="2021-07-01", end_date="2026-07-25", initial_capital=27000)
      elapsed = time.time() - t0

      if "error" in r:
          print(f"ERROR: {r['error']}")
          sys.exit(1)

      m = r["metrics"]
      tp = m.get("totalPnl", 0)
      ps = r.get("patternBreakdown", {})
      trades = m.get("trades", [])

      print(f"  Completed in {elapsed:.0f} seconds")
      print(f"  Setups found: {r.get('setupsFound', '?')}")
      print(f"  Trades: {m.get('totalTrades')}")
      print(f"  Win Rate: {m.get('winRate')}%")
      print(f"  Profit Factor: {m.get('profitFactor')}")
      print(f"  Sharpe: {m.get('sharpeRatio')}")
      print(f"  P&L: ${tp:,.0f} ({tp/270:+.1f}%)")
      print(f"  Final Equity: ${27000+tp:,.0f}")
      print(f"  Max Drawdown: {m.get('maxDrawdownPct')}%")
      print(f"  Avg Win: ${m.get('avgWin',0):,.0f}")
      print(f"  Avg Loss: ${m.get('avgLoss',0):,.0f}")
      print()
      for p, s in sorted(ps.items()):
          wr = s["wins"]/s["trades"]*100 if s["trades"]>0 else 0
          print(f"  {p:25} {s['trades']:4} trades  WR={wr:5.1f}%  P&L=${s['pnl']:>12,.0f}")
      print()
      print(f"  Filtered: {r.get('filtered')}")
      print()

      # Equity curve milestones
      eq = 27000
      milestones = [50000, 100000, 250000, 500000, 1000000]
      next_m = 0
      print("  EQUITY MILESTONES:")
      for t in trades:
          eq += t["pnl"]
          while next_m < len(milestones) and eq >= milestones[next_m]:
              print(f"    ${milestones[next_m]:>10,} reached on {t['entryDate']}")
              next_m += 1
      print(f"    Final: ${eq:,.0f}")
      print()

      # Top 10 trades
      print("  TOP 10 TRADES:")
      sorted_trades = sorted(trades, key=lambda t: t["pnl"], reverse=True)
      for t in sorted_trades[:10]:
          print(f"    {t['entryDate']} {t['symbol']:8} ${t['entryPrice']:.2f}->${t['exitPrice']:.2f} grade={t.get('grade','?')} +${t['pnl']:,.0f}")
      print()

      # Worst 5 trades
      print("  WORST 5 TRADES:")
      for t in sorted_trades[-5:]:
          print(f"    {t['entryDate']} {t['symbol']:8} ${t['entryPrice']:.2f}->${t['exitPrice']:.2f} grade={t.get('grade','?')} ${t['pnl']:,.0f}")

      print("=" * 70)
