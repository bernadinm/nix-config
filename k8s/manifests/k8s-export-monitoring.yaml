- apiVersion: v1
  data:
    monitoring-homelab-alerts.yaml: |
      groups:
      - name: node
        rules:
        - alert: NodeDiskUsageHigh
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            description: Node {{ $labels.instance }} disk usage is {{ $value | humanizePercentage
              }}
            summary: Disk usage above 85%
        - alert: NodeDiskUsageCritical
          expr: |
            (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}) > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            description: Node {{ $labels.instance }} disk usage is {{ $value | humanizePercentage
              }}
            summary: Disk usage above 95%
        - alert: NodeMemoryUsageHigh
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
          for: 10m
          labels:
            severity: warning
          annotations:
            description: Node {{ $labels.instance }} memory is {{ $value | humanizePercentage
              }}
            summary: Memory usage above 90%
      - name: kubernetes
        rules:
        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value
              }} times in 15min'
            summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} crash looping
        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.namespace }}/{{ $labels.pod }} not ready for >15min'
            summary: Pod not ready
        - alert: PVCAlmostFull
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} usage
              {{ $value | humanizePercentage }}'
            summary: PVC {{ $labels.persistentvolumeclaim }} >85% full
