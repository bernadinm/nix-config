- apiVersion: v1
  data:
    webhook.py: |
      #!/usr/bin/env python3
      import json
      import os
      import urllib.request
      from http.server import HTTPServer, BaseHTTPRequestHandler

      GOTIFY_URL = os.environ.get("GOTIFY_URL", "http://gotify.atlas-system.svc.cluster.local:80")
      GOTIFY_TOKEN = os.environ.get("GOTIFY_TOKEN", "")

      SEVERITY_PRIORITY = {
          "critical": 9,
          "warning": 6,
          "info": 3,
      }

      class WebhookHandler(BaseHTTPRequestHandler):
          def do_POST(self):
              length = int(self.headers.get("Content-Length", 0))
              body = self.rfile.read(length)
              try:
                  data = json.loads(body)
              except Exception as e:
                  self.send_response(400)
                  self.end_headers()
                  self.wfile.write(f"bad json: {e}".encode())
                  return

              status = data.get("status", "firing")
              alerts = data.get("alerts", [])

              for alert in alerts:
                  labels = alert.get("labels", {})
                  annotations = alert.get("annotations", {})
                  severity = labels.get("severity", "info")
                  priority = SEVERITY_PRIORITY.get(severity, 5)

                  if status == "resolved":
                      title = f"[RESOLVED] {labels.get('alertname', 'Alert')}"
                      priority = max(priority - 3, 1)
                  else:
                      title = labels.get("alertname", "Alert")

                  message = annotations.get("description", annotations.get("summary", json.dumps(labels)))

                  payload = json.dumps({
                      "title": title,
                      "message": message,
                      "priority": priority,
                  }).encode()

                  req = urllib.request.Request(
                      f"{GOTIFY_URL}/message?token={GOTIFY_TOKEN}",
                      data=payload,
                      headers={"Content-Type": "application/json"},
                      method="POST",
                  )
                  try:
                      urllib.request.urlopen(req, timeout=10).read()
                  except Exception as e:
                      print(f"gotify error: {e}", flush=True)

              self.send_response(200)
              self.end_headers()
              self.wfile.write(b"ok")

          def log_message(self, format, *args):
              print(format % args, flush=True)

      if __name__ == "__main__":
          port = int(os.environ.get("PORT", "8080"))
          print(f"listening on :{port}", flush=True)
          HTTPServer(("0.0.0.0", port), WebhookHandler).serve_forever()
