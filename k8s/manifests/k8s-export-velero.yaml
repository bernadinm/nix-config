- apiVersion: v1
  data:
    check.sh: |
      #!/bin/bash
      GOTIFY_URL="http://gotify.atlas-system.svc.cluster.local:80"
      GOTIFY_TOKEN="A8Ap3TmrZr94MTJ"

      # Get all backups, find latest by sorting
      LATEST=$(kubectl get backups.velero.io -n velero \
        --sort-by=.status.startTimestamp \
        -o jsonpath='{.items[*].status.phase}' 2>/dev/null | tr ' ' '\n' | tail -1)

      NAME=$(kubectl get backups.velero.io -n velero \
        --sort-by=.status.startTimestamp \
        -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | tr ' ' '\n' | tail -1)

      echo "Latest backup: $NAME (phase: $LATEST)"

      if [ -z "$LATEST" ] || [ -z "$NAME" ]; then
        curl -s -X POST "${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"title":"Backup Alert: No backups found","message":"Velero has no backups. Check the schedule.","priority":9}'
        exit 0
      fi

      if [ "$LATEST" = "Completed" ]; then
        echo "Backup $NAME completed successfully"
        exit 0
      fi

      if [ "$LATEST" = "PartiallyFailed" ] || [ "$LATEST" = "Failed" ] || [ "$LATEST" = "FailedValidation" ]; then
        curl -s -X POST "${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"title\":\"Backup ${LATEST}: ${NAME}\",\"message\":\"Latest backup is ${LATEST}. Check velero logs.\",\"priority\":8}"
        echo "Alert sent for $LATEST backup $NAME"
      fi

      if [ "$LATEST" = "InProgress" ]; then
        echo "Backup $NAME still in progress"
      fi
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"check.sh":"#!/bin/bash\nGOTIFY_URL=\"http://gotify.atlas-system.svc.cluster.local:80\"\nGOTIFY_TOKEN=\"A8Ap3TmrZr94MTJ\"\n\n# Get all backups, find latest by sorting\nLATEST=$(kubectl get backups.velero.io -n velero \\\n  --sort-by=.status.startTimestamp \\\n  -o jsonpath='{.items[*].status.phase}' 2\u003e/dev/null | tr ' ' '\\n' | tail -1)\n\nNAME=$(kubectl get backups.velero.io -n velero \\\n  --sort-by=.status.startTimestamp \\\n  -o jsonpath='{.items[*].metadata.name}' 2\u003e/dev/null | tr ' ' '\\n' | tail -1)\n\necho \"Latest backup: $NAME (phase: $LATEST)\"\n\nif [ -z \"$LATEST\" ] || [ -z \"$NAME\" ]; then\n  curl -s -X POST \"${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}\" \\\n    -H \"Content-Type: application/json\" \\\n    -d '{\"title\":\"Backup Alert: No backups found\",\"message\":\"Velero has no backups. Check the schedule.\",\"priority\":9}'\n  exit 0\nfi\n\nif [ \"$LATEST\" = \"Completed\" ]; then\n  echo \"Backup $NAME completed successfully\"\n  exit 0\nfi\n\nif [ \"$LATEST\" = \"PartiallyFailed\" ] || [ \"$LATEST\" = \"Failed\" ] || [ \"$LATEST\" = \"FailedValidation\" ]; then\n  curl -s -X POST \"${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"title\\\":\\\"Backup ${LATEST}: ${NAME}\\\",\\\"message\\\":\\\"Latest backup is ${LATEST}. Check velero logs.\\\",\\\"priority\\\":8}\"\n  echo \"Alert sent for $LATEST backup $NAME\"\nfi\n\nif [ \"$LATEST\" = \"InProgress\" ]; then\n  echo \"Backup $NAME still in progress\"\nfi\n"},"kind":"ConfigMap","metadata":{"annotations":{},"name":"backup-monitor-script","namespace":"velero"}}
