        {"apiVersion":"batch/v1","kind":"CronJob","metadata":{"annotations":{},"name":"backup-watchdog","namespace":"velero"},"spec":{"concurrencyPolicy":"Forbid","failedJobsHistoryLimit":3,"jobTemplate":{"spec":{"activeDeadlineSeconds":120,"template":{"spec":{"containers":[{"command":["/bin/bash","-c","ALERT=false\nMSG=\"\"\n\n# Check B2 storage location\nBSL_PHASE=$(kubectl get backupstoragelocation b2 -n velero -o jsonpath='{.status.phase}')\nif [ \"$BSL_PHASE\" != \"Available\" ]; then\n  ALERT=true\n  MSG=\"$MSG\\n- B2 storage is $BSL_PHASE\"\nfi\n\n# Check for failed backups in last 24h\nFAILED=$(kubectl get backups -n velero -o json | python3 -c \"\nimport json, sys\nfrom datetime import datetime, timezone, timedelta\ndata = json.load(sys.stdin)\ncutoff = datetime.now(timezone.utc) - timedelta(hours=24)\nfailed = []\nfor b in data.get('items', []):\n    phase = b.get('status', {}).get('phase', '')\n    ts = b.get('status', {}).get('startTimestamp', '')\n    if phase in ('Failed', 'PartiallyFailed') and ts:\n        t = datetime.fromisoformat(ts.replace('Z', '+00:00'))\n        if t \u003e cutoff:\n            failed.append(f\\\"{b['metadata']['name']}: {phase}\\\")\nprint('\\n'.join(failed))\n\" 2\u003e/dev/null)\n\nif [ -n \"$FAILED\" ]; then\n  ALERT=true\n  MSG=\"$MSG\\n- Failed backups:\\n$FAILED\"\nfi\n\n# Check if any successful backup exists in last 36h\nRECENT=$(kubectl get backups -n velero -o json | python3 -c \"\nimport json, sys\nfrom datetime import datetime, timezone, timedelta\ndata = json.load(sys.stdin)\ncutoff = datetime.now(timezone.utc) - timedelta(hours=36)\nfor b in data.get('items', []):\n    phase = b.get('status', {}).get('phase', '')\n    ts = b.get('status', {}).get('completionTimestamp', '')\n    if phase == 'Completed' and ts:\n        t = datetime.fromisoformat(ts.replace('Z', '+00:00'))\n        if t \u003e cutoff:\n            print('yes')\n            sys.exit()\nprint('no')\n\" 2\u003e/dev/null)\n\nif [ \"$RECENT\" = \"no\" ]; then\n  ALERT=true\n  MSG=\"$MSG\\n- No successful backup in the last 36 hours\"\nfi\n\n# Send alert if issues found\nif [ \"$ALERT\" = true ]; then\n  echo \"ALERT: Backup issues detected\"\n  echo -e \"$MSG\"\n  if [ \"$GOTIFY_TOKEN\" != \"REPLACE_WITH_GOTIFY_APP_TOKEN\" ]; then\n    curl -s -X POST \"$GOTIFY_URL/message?token=$GOTIFY_TOKEN\" \\\n      -F \"title=Backup Alert\" \\\n      -F \"message=$(echo -e \"Backup issues on astra:\\n$MSG\")\" \\\n      -F \"priority=8\"\n  fi\nelse\n  echo \"OK: All backups healthy\"\n  echo \"  B2: $BSL_PHASE\"\n  echo \"  Recent successful backup: yes\"\n  echo \"  Failed backups (24h): none\"\nfi\n"],"env":[{"name":"GOTIFY_URL","value":"http://gotify.atlas-system.svc.cluster.local:80"},{"name":"GOTIFY_TOKEN","valueFrom":{"secretKeyRef":{"key":"token","name":"gotify-token"}}}],"image":"bitnami/kubectl:latest","name":"watchdog","resources":{"limits":{"cpu":"100m","memory":"128Mi"},"requests":{"cpu":"10m","memory":"32Mi"}}}],"restartPolicy":"Never","serviceAccountName":"velero"}}}},"schedule":"0 */6 * * *","successfulJobsHistoryLimit":1}}
    creationTimestamp: "2026-04-05T16:56:21Z"
    generation: 1
    name: backup-watchdog
    namespace: velero
    resourceVersion: "33946270"
    uid: 66d3fbc5-f6cc-4aa5-9a46-03afc2a45fb7
  spec:
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 3
    jobTemplate:
      metadata: {}
      spec:
        activeDeadlineSeconds: 120
        template:
          metadata: {}
          spec:
            containers:
            - command:
              - /bin/bash
              - -c
              - |
                ALERT=false
                MSG=""

                # Check B2 storage location
                BSL_PHASE=$(kubectl get backupstoragelocation b2 -n velero -o jsonpath='{.status.phase}')
                if [ "$BSL_PHASE" != "Available" ]; then
                  ALERT=true
                  MSG="$MSG\n- B2 storage is $BSL_PHASE"
                fi

                # Check for failed backups in last 24h
                FAILED=$(kubectl get backups -n velero -o json | python3 -c "
                import json, sys
                from datetime import datetime, timezone, timedelta
                data = json.load(sys.stdin)
                cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
                failed = []
                for b in data.get('items', []):
                    phase = b.get('status', {}).get('phase', '')
                    ts = b.get('status', {}).get('startTimestamp', '')
                    if phase in ('Failed', 'PartiallyFailed') and ts:
                        t = datetime.fromisoformat(ts.replace('Z', '+00:00'))
                        if t > cutoff:
                            failed.append(f\"{b['metadata']['name']}: {phase}\")
                print('\n'.join(failed))
                " 2>/dev/null)

                if [ -n "$FAILED" ]; then
                  ALERT=true
                  MSG="$MSG\n- Failed backups:\n$FAILED"
                fi

                # Check if any successful backup exists in last 36h
                RECENT=$(kubectl get backups -n velero -o json | python3 -c "
                import json, sys
                from datetime import datetime, timezone, timedelta
                data = json.load(sys.stdin)
                cutoff = datetime.now(timezone.utc) - timedelta(hours=36)
                for b in data.get('items', []):
                    phase = b.get('status', {}).get('phase', '')
                    ts = b.get('status', {}).get('completionTimestamp', '')
                    if phase == 'Completed' and ts:
                        t = datetime.fromisoformat(ts.replace('Z', '+00:00'))
                        if t > cutoff:
                            print('yes')
                            sys.exit()
                print('no')
                " 2>/dev/null)

                if [ "$RECENT" = "no" ]; then
                  ALERT=true
                  MSG="$MSG\n- No successful backup in the last 36 hours"
                fi

                # Send alert if issues found
                if [ "$ALERT" = true ]; then
                  echo "ALERT: Backup issues detected"
                  echo -e "$MSG"
                  if [ "$GOTIFY_TOKEN" != "REPLACE_WITH_GOTIFY_APP_TOKEN" ]; then
                    curl -s -X POST "$GOTIFY_URL/message?token=$GOTIFY_TOKEN" \
                      -F "title=Backup Alert" \
                      -F "message=$(echo -e "Backup issues on astra:\n$MSG")" \
                      -F "priority=8"
                  fi
                else
                  echo "OK: All backups healthy"
                  echo "  B2: $BSL_PHASE"
                  echo "  Recent successful backup: yes"
                  echo "  Failed backups (24h): none"
                fi
              env:
              - name: GOTIFY_URL
                value: http://gotify.atlas-system.svc.cluster.local:80
              - name: GOTIFY_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: gotify-token
              image: bitnami/kubectl:latest
              imagePullPolicy: Always
              name: watchdog
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 10m
                  memory: 32Mi
              terminationMessagePath: /dev/termination-log
              terminationMessagePolicy: File
            dnsPolicy: ClusterFirst
            restartPolicy: Never
            schedulerName: default-scheduler
            securityContext: {}
            serviceAccount: velero
            serviceAccountName: velero
            terminationGracePeriodSeconds: 30
    schedule: 0 */6 * * *
    successfulJobsHistoryLimit: 1
    suspend: false
  status:
    lastScheduleTime: "2026-07-27T04:00:00Z"
