        {"apiVersion":"batch/v1","kind":"CronJob","metadata":{"annotations":{},"name":"backup-monitor","namespace":"velero"},"spec":{"failedJobsHistoryLimit":3,"jobTemplate":{"spec":{"template":{"spec":{"containers":[{"command":["/bin/bash","-c","GOTIFY_URL=\"http://gotify.atlas-system.svc.cluster.local:80\"\nGOTIFY_TOKEN=\"A8Ap3TmrZr94MTJ\"\n\n# Get latest backup\nLATEST=$(kubectl get backups.velero.io -n velero --sort-by=.status.startTimestamp -o jsonpath='{range .items[-1:]}{.status.phase}|{.metadata.name}|{.status.errors}|{.status.warnings}|{.status.startTimestamp}{end}' 2\u003e/dev/null)\n\nif [ -z \"$LATEST\" ]; then\n  LATEST=\"NO_BACKUPS\"\nfi\n\nif [ \"$LATEST\" = \"NO_BACKUPS\" ]; then\n  curl -s -X POST \"${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}\" \\\n    -H \"Content-Type: application/json\" \\\n    -d '{\"title\":\"Backup Alert: No backups found\",\"message\":\"Velero has no backups. Check the schedule.\",\"priority\":9}'\n  exit 0\nfi\n\nIFS='|' read -r PHASE NAME ERRORS WARNINGS STARTED \u003c\u003c\u003c \"$LATEST\"\n\nif [ \"$PHASE\" = \"Completed\" ]; then\n  echo \"Backup $NAME completed successfully\"\n  exit 0\nfi\n\nif [ \"$PHASE\" = \"PartiallyFailed\" ] || [ \"$PHASE\" = \"Failed\" ]; then\n  curl -s -X POST \"${GOTIFY_URL}/message?token=${GOTIFY_TOKEN}\" \\\n    -H \"Content-Type: application/json\" \\\n    -d \"{\\\"title\\\":\\\"Backup ${PHASE}: ${NAME}\\\",\\\"message\\\":\\\"Errors: ${ERRORS}, Warnings: ${WARNINGS}\\nStarted: ${STARTED}\\\",\\\"priority\\\":8}\"\n  echo \"Alert sent for $PHASE backup $NAME\"\nfi\n\nif [ \"$PHASE\" = \"InProgress\" ]; then\n  echo \"Backup $NAME still in progress\"\nfi\n"],"image":"bitnami/kubectl:latest","name":"monitor","resources":{"limits":{"cpu":"100m","memory":"64Mi"},"requests":{"cpu":"10m","memory":"32Mi"}}}],"restartPolicy":"Never","serviceAccountName":"backup-monitor"}}}},"schedule":"30 */1 * * *","successfulJobsHistoryLimit":1}}
