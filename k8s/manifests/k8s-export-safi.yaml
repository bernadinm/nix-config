    signup.mjs: "import { chromium } from 'playwright';\nimport { readFileSync } from
      'fs';\n\nconst SIGNUP_DATA = {\n  firstName: 'Miguel',\n  lastName: 'Bernadin',\n
      \ email: 'hello@safi.africa',\n  username: 'unifytechlabs',\n  phone: '0769479634',\n
      \ company: 'Unify Tech Labs LTD',\n};\n\nconst GOTIFY_URL = process.env.GOTIFY_URL
      || 'http://gotify.atlas-system.svc.cluster.local/message';\nconst GOTIFY_TOKEN
      = process.env.GOTIFY_TOKEN || '';\n\nasync function sendGotify(title, message,
      priority = 8) {\n  if (!GOTIFY_TOKEN) return;\n  try {\n    await fetch(GOTIFY_URL,
      {\n      method: 'POST',\n      headers: { 'X-Gotify-Key': GOTIFY_TOKEN, 'Content-Type':
      'application/json' },\n      body: JSON.stringify({ title, message, priority
      }),\n    });\n    console.log(`[Gotify] Sent: ${title}`);\n  } catch (e) {\n
      \   console.log(`[Gotify] Failed: ${e.message}`);\n  }\n}\n\nasync function
      suspendCronJob() {\n  try {\n    const token = readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/token',
      'utf8');\n    const ca = readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/ca.crt');\n
      \   const ns = readFileSync('/var/run/secrets/kubernetes.io/serviceaccount/namespace',
      'utf8');\n    const url = `https://kubernetes.default.svc/apis/batch/v1/namespaces/${ns}/cronjobs/gavaconnect-signup`;\n
      \   const res = await fetch(url, {\n      method: 'PATCH',\n      headers: {\n
      \       'Authorization': `Bearer ${token}`,\n        'Content-Type': 'application/merge-patch+json',\n
      \     },\n      body: JSON.stringify({ spec: { suspend: true } }),\n      //
      Node 22 doesn't verify K8s self-signed certs by default\n      dispatcher: undefined,\n
      \   });\n    if (res.ok) {\n      console.log('[K8s] CronJob suspended — no
      more retries.');\n    } else {\n      console.log(`[K8s] Failed to suspend:
      ${res.status} ${await res.text()}`);\n    }\n  } catch (e) {\n    console.log(`[K8s]
      Suspend error: ${e.message}`);\n  }\n}\n\nconsole.log(`=== GavaConnect Signup
      at ${new Date().toISOString()} ===`);\n\nconst browser = await chromium.launch({
      headless: true, args: ['--no-sandbox', '--disable-setuid-sandbox'] });\nconst
      page = await browser.newPage();\n\ntry {\n  await page.goto('https://developer.go.ke/session/user/signup',
      { waitUntil: 'networkidle', timeout: 30000 });\n  await page.waitForSelector('input',
      { timeout: 15000 });\n  await page.waitForTimeout(2000);\n\n  const fill = async
      (labels, value) => {\n    for (const label of labels) {\n      try {\n        const
      el = page.getByLabel(label);\n        if (await el.count() > 0) { await el.fill(value);
      return true; }\n      } catch(e) {}\n      try {\n        const el = page.locator(`input[placeholder=\"${label}\"]`);\n
      \       if (await el.count() > 0) { await el.fill(value); return true; }\n      }
      catch(e) {}\n    }\n    return false;\n  };\n\n  await fill(['First Name'],
      SIGNUP_DATA.firstName);\n  await fill(['Last Name'], SIGNUP_DATA.lastName);\n
      \ await fill(['Email Address', 'Email'], SIGNUP_DATA.email);\n  await fill(['Username'],
      SIGNUP_DATA.username);\n\n  const combobox = page.locator('[role=\"combobox\"]').first();\n
      \ if (await combobox.count() > 0) {\n    await combobox.click();\n    await
      page.waitForTimeout(800);\n    const kenyaOpt = page.locator('[role=\"listbox\"]
      [role=\"option\"]', { hasText: 'Kenya' }).first();\n    if (await kenyaOpt.count()
      > 0) {\n      await kenyaOpt.click();\n      console.log('✓ All fields filled
      + Kenya selected');\n    }\n  }\n\n  await fill(['Phone Number', 'Phone'], SIGNUP_DATA.phone);\n
      \ await fill(['Company Name', 'Company'], SIGNUP_DATA.company);\n\n  const checkbox
      = page.locator('input[type=\"checkbox\"]');\n  if (await checkbox.count() >
      0) await checkbox.check();\n\n  const submitBtn = page.getByRole('button', {
      name: /Sign Up|Submit|Register/i });\n  if (await submitBtn.count() > 0) {\n
      \   const disabled = await submitBtn.getAttribute('disabled');\n    await submitBtn.click(disabled
      !== null ? { force: true } : undefined);\n    console.log('→ Submitted');\n\n
      \   await page.waitForTimeout(10000);\n    const text = await page.textContent('body');\n\n
      \   if (text.includes('success') || text.includes('verification') || text.includes('check
      your email') || text.includes('activate')) {\n      console.log('\U0001F389
      SUCCESS!');\n      await sendGotify('\U0001F389 GavaConnect Signup SUCCESS!',
      `Account registered for ${SIGNUP_DATA.email}. Check email for verification.`,
      10);\n      await suspendCronJob();\n      await browser.close();\n      process.exit(0);\n
      \   } else if (text.includes('already exists') || text.includes('already registered'))
      {\n      console.log('⚠ Account already exists');\n      await sendGotify('⚠
      GavaConnect Account Exists', `${SIGNUP_DATA.username} already registered. Try
      logging in.`, 8);\n      await suspendCronJob();\n      await browser.close();\n
      \     process.exit(0);\n    } else if (text.includes('Something went wrong'))
      {\n      console.log('✗ Backend error. Will retry.');\n      await browser.close();\n
      \     process.exit(1);\n    } else {\n      console.log('? Result:', text.slice(0,
      300));\n      await browser.close();\n      process.exit(1);\n    }\n  }\n}
      catch(e) {\n  console.log(`Error: ${e.message.slice(0, 200)}`);\n  await browser.close();\n
      \ process.exit(1);\n}\n"
